<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070907">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Tactical Knowledge Base</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#070907;color:#eef2e9;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.boot{height:100%;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 15% 0,rgba(157,175,120,.08),transparent 32%),#070907}.panel{width:min(620px,100%);clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);border:1px solid #3a4334;border-left:4px solid #9daf78;padding:25px;background:#0c0f0c;box-shadow:0 28px 90px rgba(0,0,0,.45)}.code{display:block;margin-bottom:12px;color:#9daf78;font:700 10px/1 "SFMono-Regular",Consolas,monospace;letter-spacing:.15em}.title{margin:0 0 10px;font-size:clamp(22px,5vw,34px);letter-spacing:-.035em}.status{color:#b4beb0;line-height:1.6}.bar{height:3px;background:#252b23;margin-top:20px;overflow:hidden}.bar:after{content:"";display:block;width:32%;height:100%;background:#9daf78;animation:load 1.15s infinite linear}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(330%)}}.error{border-left-color:#bd6c5f}.error .code{color:#d98a7c}.details{margin-top:14px;color:#7d887a;font:11px/1.5 "SFMono-Regular",Consolas,monospace;overflow-wrap:anywhere}</style>
</head>
<body>
<div class="boot"><main class="panel" id="panel"><span class="code">TKB / BOOT</span><h1 class="title">Tactical Knowledge Base</h1><div class="status" id="status">Načítavam technickú referenčnú platformu…</div><div class="bar" id="bar"></div><div class="details" id="details">Overujem produkčný balík.</div></main></div>
<script>
(async()=>{
 const panel=document.getElementById('panel'),status=document.getElementById('status'),details=document.getElementById('details');
 try{
  if(!('DecompressionStream' in window))throw new Error('Prehliadač nepodporuje dekompresiu. Použi aktuálny Chrome, Edge, Firefox alebo Safari.');
  const files=["payload-01.b64"];
  const parts=[];
  for(let i=0;i<files.length;i++){details.textContent=`Načítavam dátový blok ${i+1} / ${files.length}`;const r=await fetch(files[i],{cache:'no-store'});if(!r.ok)throw new Error(`Nepodarilo sa načítať ${files[i]} (${r.status}).`);parts.push((await r.text()).trim())}
  details.textContent='Dekompresia a inicializácia rozhrania…';
  const binary=atob(parts.join('')),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();
  if(!/^<!doctype html>/i.test(html.trim()))throw new Error('Produkčný balík nemá očakávaný HTML formát.');
  document.open();document.write(html);document.close();
 }catch(error){panel.classList.add('error');panel.querySelector('.code').textContent='TKB / LOAD ERROR';status.textContent='Aplikáciu sa nepodarilo spustiť.';details.textContent=error?.message||String(error);document.getElementById('bar')?.remove()}
})();
</script>
</body>
</html>
